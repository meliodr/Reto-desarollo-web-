<a class="skip-link" href="#main-content">Saltar al contenido</a>
<div class="app-shell">
  <header class="institutional-header">
    <div class="institutional-header-inner">
      <a class="brand" routerLink="/peis" aria-label="SISPLAN, planes estratégicos">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>SISPLAN<small>Sistema de Planificación Institucional</small></span>
      </a>
      <nav aria-label="Navegación principal">
        <a class="institutional-nav-link" routerLink="/peis">Planes estratégicos</a>
      </nav>
    </div>
  </header>
  <div class="workspace">
    <main id="main-content" tabindex="-1">
      @if (feedback.message()) {
        <div class="notice notice-success global-notice" role="status">
          <span><strong>Guardado correctamente.</strong> {{ feedback.message() }}</span
          ><button
            class="icon-button"
            type="button"
            (click)="feedback.message.set('')"
            aria-label="Cerrar confirmación"
          >
            ×
          </button>
        </div>
      }
      <router-outlet />
    </main>
    <footer class="footer">
      <span
        >SISPLAN <span class="footer-separator">/</span> Sistema de Gestión de Planificación</span
      ><span>Desarrollo local · acceso institucional pendiente</span>
    </footer>
  </div>
</div>
