name: Verificación de SISPLAN

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: sisplan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/Sisplan.Api.csproj -c Release
