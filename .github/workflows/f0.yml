name: Verificación de SISPLAN

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: sisplan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Preparar Chromium para el recorrido OIDC
        run: |
          python -m pip install playwright==1.56.0 PyYAML==6.0.3 jsonschema==4.25.1
          python -m playwright install --with-deps chromium
      - run: python contracts/verificar_f0.py
      - name: Probar migraciones, autorización y módulos con PostgreSQL y Keycloak
        run: bash infra/ci/verificar-f0.sh
      - uses: actions/upload-artifact@v4
        with:
          name: capturas-f0
          path: ${{ runner.temp }}/sisplan-f0-capturas/*.png
          if-no-files-found: error
          retention-days: 14
