openapi: 3.1.0
info:
  title: SISPLAN — Planificación estratégica y POA anuales
  version: 0.6.0
  description: |
    Todas las operaciones de este contrato requieren un token Bearer válido y una membresía institucional.
    El servidor obtiene el emisor y el sujeto del token. X-Institucion-Id selecciona una membresía verificada.
    Si se omite, se elige la primera institución disponible por ID. Los permisos se calculan en cada solicitud.
    Los listados reflejan el ámbito de lectura. Los recursos fuera de ese ámbito se tratan como inexistentes.
servers:
  - url: http://127.0.0.1:5080/api/v1
security:
  - AccesoInstitucional: []
paths:
  /sesion:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
    get:
      summary: Consultar la identidad verificada y las instituciones disponibles
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Membresías propias e identificador de la institución seleccionada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
  /organizacion:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
    get:
      summary: Consultar dependencias, períodos y unidades de medida de la institución
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Organización y catálogos en el ámbito del actor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organizacion' }
  /auditoria:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
    get:
      summary: Consultar escrituras registradas en la institución activa
      description: Consulta disponible para Auditor y AdministradorInstitucional. Hasta 100 eventos por página, ordenados por id descendente.
      parameters:
        - name: antesDe
          in: query
          description: Solicita los eventos anteriores a este id (exclusivo).
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Eventos de escritura de la institución
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventoAuditoria' }
  /peis:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
    get:
      summary: Consultar borradores de PEI
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Borradores registrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pei' }
    post:
      summary: Crear el primer borrador de un PEI
      requestBody: { $ref: '#/components/requestBodies/Pei' }
      responses:
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '201': { $ref: '#/components/responses/PeiCreado' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '415': { description: Se requiere application/json }
        '422': { $ref: '#/components/responses/Validacion' }
  /peis/{id}:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Abrir un PEI y obtener la etiqueta de su versión
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200': { $ref: '#/components/responses/Pei' }
        '404': { description: PEI no encontrado }
  /pei-versiones/{versionId}:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Guardar los campos editables del borrador
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag fuerte devuelto al abrir o guardar el borrador, incluidas sus comillas.
          schema: { type: string }
      requestBody: { $ref: '#/components/requestBodies/Pei' }
      responses:
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200': { $ref: '#/components/responses/Pei' }
        '404': { description: Versión no encontrada }
        '409': { description: El PEI no está en borrador }
        '412': { description: Otro guardado modificó el borrador. Volver a consultar antes de reintentar. }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '415': { description: Se requiere application/json }
        '422': { $ref: '#/components/responses/Validacion' }
        '428': { description: Falta If-Match }
  /peis/{peiId}/ejes:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - $ref: '#/components/parameters/PeiId'
    get:
      summary: Consultar los ejes activos e inactivos de la versión actual del PEI
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200': { $ref: '#/components/responses/Ejes' }
        '404': { description: PEI no encontrado }
    post:
      summary: Crear un eje activo en la versión de trabajo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosEje' }
      responses:
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '201': { $ref: '#/components/responses/EjeCreado' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { description: PEI no encontrado }
        '409': { description: El PEI no está en borrador }
        '415': { description: Se requiere application/json }
        '422': { $ref: '#/components/responses/Validacion' }
  /peis/{peiId}/ejes/{ejeId}:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - $ref: '#/components/parameters/PeiId'
      - $ref: '#/components/parameters/EjeId'
    get:
      summary: Consultar la revisión actual del eje y su ETag
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200': { $ref: '#/components/responses/Eje' }
        '404': { description: Eje no encontrado en la versión actual del PEI }
    put:
      summary: Guardar los cambios del eje, incluida su inactivación
      description: Un cambio agrega una revisión y conserva las anteriores. Una solicitud sin cambios conserva la revisión actual.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag fuerte correspondiente a la revisión enviada, incluidas sus comillas.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarEje' }
      responses:
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200': { $ref: '#/components/responses/Eje' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { description: Eje no encontrado en la versión actual del PEI }
        '409': { description: El PEI no está en borrador }
        '412': { description: La revisión no corresponde al ETag o el eje cambió desde la consulta }
        '415': { description: Se requiere application/json }
        '422': { $ref: '#/components/responses/Validacion' }
        '428': { description: Falta If-Match }
  /peis/{peiId}/ejes/{ejeId}/versiones:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - $ref: '#/components/parameters/PeiId'
      - $ref: '#/components/parameters/EjeId'
    get:
      summary: Consultar las revisiones del eje, de la más reciente a la primera
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200': { $ref: '#/components/responses/Ejes' }
        '404': { description: Eje no encontrado en la versión actual del PEI }
  /peis/{peiId}/ejes/{ejeId}/objetivos:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - $ref: '#/components/parameters/PeiId'
      - $ref: '#/components/parameters/EjeId'
    get:
      summary: Consultar los objetivos de un eje activo o inactivo
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Objetivos registrados en el eje
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Objetivo' }
        '404': { description: Eje no encontrado en la versión actual del PEI }
    post:
      summary: Registrar un objetivo estratégico bajo un eje activo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosObjetivo' }
      responses:
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '201':
          description: Objetivo registrado
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objetivo' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { description: Eje no encontrado en la versión actual del PEI }
        '409': { description: 'Código ya registrado en el eje, eje inactivo o PEI fuera de borrador' }
        '415': { description: Se requiere application/json }
        '422': { $ref: '#/components/responses/Validacion' }
  /peis/{peiId}/ejes/{ejeId}/objetivos/{objetivoId}:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - $ref: '#/components/parameters/PeiId'
      - $ref: '#/components/parameters/EjeId'
      - name: objetivoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Consultar un objetivo del eje
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Objetivo registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objetivo' }
        '404': { description: Objetivo no encontrado en el eje de este PEI }
  /peis/{peiId}/ejes/{ejeId}/objetivos/{objetivoId}/indicadores:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - $ref: '#/components/parameters/PeiId'
      - $ref: '#/components/parameters/EjeId'
      - $ref: '#/components/parameters/ObjetivoId'
    get:
      summary: Consultar indicadores del objetivo
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Indicadores registrados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Indicador' } }
        '404': { description: Objetivo ajeno a la versión actual del PEI }
    post:
      summary: Registrar un indicador en un eje activo de un PEI en borrador
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosIndicador' }
      responses:
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '415': { description: Se requiere application/json }
        '201':
          description: Indicador registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Indicador' }
        '404': { description: Objetivo ajeno a la versión actual del PEI }
        '409': { description: Eje inactivo o PEI fuera de borrador }
        '422': { $ref: '#/components/responses/Validacion' }
  /peis/{peiId}/ejes/{ejeId}/objetivos/{objetivoId}/indicadores/{indicadorId}/mediciones:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - $ref: '#/components/parameters/PeiId'
      - $ref: '#/components/parameters/EjeId'
      - $ref: '#/components/parameters/ObjetivoId'
      - { name: indicadorId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Consultar mediciones del indicador
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Mediciones ordenadas por fecha descendente
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Medicion' } }
        '404': { description: Indicador ajeno al objetivo }
    post:
      summary: Registrar una medición fechada dentro del PEI
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosMedicion' }
      responses:
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '415': { description: Se requiere application/json }
        '201':
          description: Medición registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Medicion' }
        '404': { description: Indicador ajeno al objetivo }
        '409': { description: 'Fecha duplicada, eje inactivo o PEI fuera de borrador' }
        '422': { $ref: '#/components/responses/Validacion' }
  /pei-versiones/{versionId}/transiciones:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Consultar acciones habilitadas para el planificador autenticado
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '200':
          description: Acciones disponibles según el estado y el actor
          content:
            application/json:
              schema:
                type: object
                required: [acciones]
                properties:
                  acciones: { type: array, items: { $ref: '#/components/schemas/AccionPei' } }
                  motivoDevolucion: { type: [string, 'null'] }
        '401': { description: Sesión requerida }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: Versión no encontrada }
    post:
      summary: Enviar, devolver, aprobar o publicar la versión del PEI
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { $ref: '#/components/schemas/AccionPei' }
                motivo: { type: [string, 'null'], maxLength: 4000, description: Requerido para devolver. }
      responses:
        '200': { $ref: '#/components/responses/Pei' }
        '401': { description: Sesión requerida }
        '403': { description: El rol o la participación previa no autoriza la acción }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '415': { description: Se requiere application/json }
        '404': { description: Versión no encontrada }
        '409': { description: 'Estado incompatible, estructura incompleta o vigencia solapada' }
        '412': { description: ETag obsoleto }
        '422': { $ref: '#/components/responses/Validacion' }
        '428': { description: Falta If-Match }
  /poas:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
    get:
      summary: Listar POA independientes y vinculados
      description: Las cuentas de área ven su dependencia. Si PEI está deshabilitado, peiId y peiNombre se devuelven nulos.
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Planes operativos registrados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PoaV2' } }
    post:
      summary: Crear un POA anual con vínculo opcional a un PEI publicado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anio]
              properties:
                anio: { type: integer, minimum: 1, maximum: 9999 }
                dependenciaId: { type: [string, 'null'], format: uuid, description: Dependencia activa dentro del ámbito del actor. }
                peiId: { type: [string, 'null'], format: uuid }
                presupuestoReferencia:
                  type: [string, 'null']
                  pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'
                  description: Importe estimado opcional en DOP. Usa punto decimal y omite los separadores de miles.
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '201':
          description: POA en borrador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoaV2' }
        '409': { description: 'POA duplicado o PEI vinculado indisponible o fuera del período' }
        '422': { $ref: '#/components/responses/Validacion' }
  /peis/{peiId}/catalogo-digemaps:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - $ref: '#/components/parameters/PeiId'
    post:
      summary: Cargar los registros DIGEMAPS en un PEI editable y sin ejes
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '201':
          description: Catálogo cargado
          content:
            application/json:
              schema:
                type: object
                required: [ejes, objetivos, indicadores]
                properties:
                  ejes: { type: integer }
                  objetivos: { type: integer }
                  indicadores: { type: integer }
        '404': { description: PEI no encontrado }
        '409': { description: 'PEI no editable o con ejes existentes' }
  /peis/{peiId}/poas:
    parameters:
      - $ref: '#/components/parameters/InstitucionActiva'
      - $ref: '#/components/parameters/PeiId'
    get:
      summary: Consultar POA vinculados al PEI y evaluaciones históricas
      description: Requiere PEI y POA habilitados en la institución activa.
      responses:
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '200':
          description: POA ordenados por año
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Poa' } }
        '401': { description: Sesión requerida }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: PEI no encontrado }
components:
  securitySchemes:
    AccesoInstitucional:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso OIDC con audiencia sisplan-api. El servidor resuelve rol y dependencia desde la membresía de la institución activa.
  parameters:
    InstitucionActiva:
      name: X-Institucion-Id
      in: header
      required: false
      description: UUID de una institución disponible para el sujeto autenticado.
      schema: { type: string, format: uuid }
    ObjetivoId:
      name: objetivoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PeiId:
      name: peiId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EjeId:
      name: ejeId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Identidad:
      type: object
      required: [emisor, sujeto]
      properties:
        emisor: { type: string, format: uri }
        sujeto: { type: string, minLength: 1 }
    Membresia:
      type: object
      required: [id, nombre, rol, dependenciaId, modulos]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        rol:
          type: string
          enum: [SuperAdministrador, AdministradorInstitucional, DirectorPlanificacion, AnalistaPlanificacion, ResponsableArea, DirectorArea, Auditor, MaximaAutoridad, ComiteEstrategico, Planificador]
          description: Planificador es el alias histórico de AnalistaPlanificacion.
        dependenciaId: { type: [string, 'null'], format: uuid }
        modulos:
          type: object
          required: [pei, poa]
          properties:
            pei: { type: boolean }
            poa: { type: boolean }
    Sesion:
      type: object
      required: [actor, instituciones, institucionActivaId]
      properties:
        actor: { $ref: '#/components/schemas/Identidad' }
        instituciones:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Membresia' }
        institucionActivaId: { type: string, format: uuid }
    Organizacion:
      type: object
      required: [dependencias, periodos, unidadesMedida]
      properties:
        dependencias:
          type: array
          items:
            type: object
            required: [id, nombre, activa]
            properties:
              id: { type: string, format: uuid }
              nombre: { type: string }
              activa: { type: boolean }
        periodos:
          type: array
          items:
            type: object
            required: [id, nombre, fechaInicio, fechaFin]
            properties:
              id: { type: string, format: uuid }
              nombre: { type: string }
              fechaInicio: { type: string, format: date }
              fechaFin: { type: string, format: date }
        unidadesMedida:
          type: array
          items:
            type: object
            required: [codigo, nombre]
            properties:
              codigo: { type: string }
              nombre: { type: string }
    EventoAuditoria:
      type: object
      required: [id, institucionId, emisor, sujeto, accion, entidad, referencia, fecha]
      properties:
        id: { type: integer, format: int64 }
        institucionId: { type: string, format: uuid }
        emisor: { type: string }
        sujeto: { type: string }
        accion: { type: string, enum: [INSERT, UPDATE, DELETE] }
        entidad: { type: string }
        referencia: { type: string }
        fecha: { type: string, format: date-time }
    DecimalIndicador:
      type: string
      pattern: '^-?[0-9]{1,12}(\.[0-9]{1,4})?$'
      description: Decimal exacto en formato de texto. La API también acepta números JSON en solicitudes existentes.
    DatosIndicador:
      type: object
      required: [nombre, formula, unidad, lineaBase, meta, frecuencia]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 200 }
        formula: { type: string, minLength: 1, maxLength: 4000 }
        unidad: { type: string, minLength: 1, maxLength: 100 }
        lineaBase: { $ref: '#/components/schemas/DecimalIndicador' }
        meta: { $ref: '#/components/schemas/DecimalIndicador' }
        frecuencia: { type: string, minLength: 1, maxLength: 100 }
    Indicador:
      type: object
      required: [id, nombre, formula, unidad, lineaBase, meta, frecuencia]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        formula: { type: [string, 'null'] }
        unidad: { type: [string, 'null'] }
        lineaBase:
          anyOf:
            - $ref: '#/components/schemas/DecimalIndicador'
            - type: 'null'
        meta:
          anyOf:
            - $ref: '#/components/schemas/DecimalIndicador'
            - type: 'null'
        frecuencia: { type: [string, 'null'] }
    DatosMedicion:
      type: object
      required: [periodo, valor]
      properties:
        periodo: { type: string, format: date }
        valor: { $ref: '#/components/schemas/DecimalIndicador' }
    Medicion:
      allOf:
        - $ref: '#/components/schemas/DatosMedicion'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    AccionPei:
      type: string
      enum: [enviar, revisar, validar_comite, devolver, corregir, aprobar, publicar]
    EstadoPoa:
      type: string
      enum: [borrador, formulacion, en_revision, observado, aprobado, rechazado, en_ejecucion, cerrado]
    PoaV2:
      type: object
      required: [id, anio, estado, fechaInicio, fechaFin, peiId, peiNombre, presupuestoReferencia, dependenciaId]
      properties:
        id: { type: string, format: uuid }
        anio: { type: integer, minimum: 1, maximum: 9999 }
        estado: { $ref: '#/components/schemas/EstadoPoa' }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        peiId: { type: [string, 'null'], format: uuid }
        dependenciaId: { type: [string, 'null'], format: uuid }
        peiNombre: { type: [string, 'null'] }
        presupuestoReferencia:
          type: [string, 'null']
          pattern: '^[0-9]{1,12}\.[0-9]{2}$'
          description: Importe estimado en DOP o null si queda sin registrar.
    Poa:
      type: object
      required: [id, anio, estado, fechaInicio, fechaFin, vigente, evaluaciones]
      properties:
        id: { type: string, format: uuid }
        anio: { type: integer, minimum: 1, maximum: 9999 }
        estado: { $ref: '#/components/schemas/EstadoPoa' }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        vigente: { type: boolean }
        evaluaciones:
          type: array
          items:
            type: object
            required: [id, cuatrimestre, fechaInicio, fechaFin, estado]
            properties:
              id: { type: string, format: uuid }
              cuatrimestre: { type: integer, enum: [1, 2, 3] }
              fechaInicio: { type: string, format: date }
              fechaFin: { type: string, format: date }
              estado: { type: string, enum: [generada, fuera_de_vigencia, en_revision, emitida, publicada] }
    DatosObjetivo:
      type: object
      required: [codigo, nombre, descripcion, resultadoEsperado, lineaAccion]
      properties:
        codigo: { type: string, minLength: 1, maxLength: 50, description: Único dentro del eje. }
        nombre: { type: string, minLength: 3, maxLength: 200 }
        descripcion: { type: string, minLength: 1, maxLength: 4000 }
        resultadoEsperado: { type: string, minLength: 1, maxLength: 4000 }
        lineaAccion: { type: string, minLength: 1, maxLength: 4000 }
    Objetivo:
      allOf:
        - $ref: '#/components/schemas/DatosObjetivo'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    DatosEje:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 200 }
        descripcion: { type: [string, 'null'], maxLength: 4000 }
    ActualizarEje:
      allOf:
        - $ref: '#/components/schemas/DatosEje'
        - type: object
          required: [activo, revision]
          properties:
            activo: { type: boolean }
            revision: { type: integer, format: int64, minimum: 1 }
    Eje:
      allOf:
        - $ref: '#/components/schemas/ActualizarEje'
        - type: object
          required: [id, descripcion, actualizadoEn]
          properties:
            id: { type: string, format: uuid }
            actualizadoEn: { type: string, format: date-time }
    DatosPei:
      type: object
      required: [nombre, tipo, fechaInicio, fechaFin, mision, vision, valores]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 200 }
        tipo: { type: string, enum: [ordinario, extraordinario] }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        mision: { type: string, minLength: 1, maxLength: 4000 }
        vision: { type: string, minLength: 1, maxLength: 4000 }
        valores: { type: string, minLength: 1, maxLength: 4000 }
      description: Las fechas son ISO YYYY-MM-DD y el fin es posterior o igual al inicio. El intervalo abarca cuatro años calendario inclusivos para un plan ordinario y cinco para uno extraordinario.
    Pei:
      allOf:
        - $ref: '#/components/schemas/DatosPei'
        - type: object
          required: [id, versionId, estado]
          properties:
            id: { type: string, format: uuid }
            versionId: { type: string, format: uuid }
            estado: { type: string, enum: [borrador, en_revision, observado, corregido, aprobado, publicado] }
    ProblemaValidacion:
      type: object
      required: [status, errors]
      properties:
        status: { type: integer, const: 422 }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
  requestBodies:
    Pei:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DatosPei' }
          example:
            nombre: PEI de demostración
            tipo: ordinario
            fechaInicio: '2026-01-01'
            fechaFin: '2029-12-31'
            mision: Fortalecer la planificación institucional.
            vision: Dar seguimiento verificable a los resultados.
            valores: Transparencia y responsabilidad.
  responses:
    SolicitudInvalida:
      description: Formato inválido del encabezado institucional, los parámetros de consulta o el cuerpo de la solicitud.
    SinSesion:
      description: Falta un token válido o ha expirado.
    SinPermiso:
      description: La membresía, la dependencia, el rol o los módulos habilitados impiden la operación.
    Ejes:
      description: Lista de ejes o de revisiones
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Eje' }
    Eje:
      description: Revisión actual del eje
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Eje' }
    EjeCreado:
      description: Eje activo en revisión 1
      headers:
        Location:
          schema: { type: string }
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Eje' }
    Pei:
      description: Borrador actualizado o consultado
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pei' }
    PeiCreado:
      description: Borrador creado
      headers:
        Location:
          schema: { type: string }
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pei' }
    Validacion:
      description: Campos o fechas inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }
