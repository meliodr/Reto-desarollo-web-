services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: sisplan
      POSTGRES_USER: sisplan
      POSTGRES_PASSWORD: ${SISPLAN_DB_PASSWORD:?Define SISPLAN_DB_PASSWORD en tu terminal o archivo .env local}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - sisplan-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sisplan -d sisplan']
      interval: 2s
      timeout: 3s
      retries: 15
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [institucional]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SISPLAN_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SISPLAN_KEYCLOAK_PASSWORD:-}
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./infra/keycloak/sisplan-realm.json:/opt/keycloak/data/import/sisplan-realm.json:ro
      - sisplan-keycloak:/opt/keycloak/data
volumes:
  sisplan-keycloak:
  sisplan-postgres:
